[package]
name = "cq"
version = "0.1.0"
edition = "2021"
description = "Query AI agent session transcripts with SQL"

[dependencies]
duckdb = { version = "1", features = ["bundled", "json"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
