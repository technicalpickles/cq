name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0 # incremental builds don't help CI and bloat the cache
  # libduckdb-sys compiles ~290 C++ files through the cc crate, which is the
  # ~10m cost on a rust-cache miss. rust-cache restores only by prefix once
  # Cargo.lock changes, and that partial restore did not save the rebuild.
  # sccache keys each C++ file by content, so it hits regardless. Only the
  # test and clippy jobs install sccache; fmt never compiles C++.
  SCCACHE_GHA_ENABLED: "true"
  CC: sccache cc
  CXX: sccache c++

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: a rolling `stable` changes the rustc version, which is part of
      # the rust-cache key, so every new release silently invalidates the cache
      # and forces a full ~10m libduckdb-sys rebuild. Bump this deliberately.
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct key from clippy: `cargo test` does full codegen while
          # `cargo clippy` only check-builds (metadata). A shared key let
          # whichever job saved first win, leaving the other to rebuild from
          # scratch (test ate a 10m libduckdb-sys recompile against a clippy
          # cache). Separate keys keep a complete cache per build kind.
          shared-key: test-sccache-probe
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo test --locked
      - run: sccache --show-stats
        if: always()

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0 # pinned (see test job)
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-sccache-probe
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: sccache --show-stats
        if: always()

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0 # pinned (see test job)
        with:
          components: rustfmt
      - run: cargo fmt --check
