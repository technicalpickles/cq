name: PR Title

# Squash-merging uses the PR title as the merge commit's subject, and that's
# what release-please parses on main (see .github/workflows/release-please.yml).
# A title without a conventional-commit type produces a merge commit
# release-please can't classify, so it silently treats the merge as having no
# releasable changes -- no version bump, no changelog entry. This check catches
# that before merge instead of after.
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            build
            ci
            perf
            refactor
            revert
            style
            test
